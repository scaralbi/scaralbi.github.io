title: Albi's Website
description: Personal website and blog
url: https://scaralbi.github.io
baseurl: ""

# Blog settings
permalink: /blog/:year/:month/:day/:title/

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/
  recipes:
    output: true
    permalink: /recipes/:name/

# Default front matter for posts and recipes
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Albi"
  -
    scope:
      path: ""
      type: "recipes"
    values:
      layout: "recipe"

# Building settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-redirect-from

# Tag pages
jekyll-archives:
  enabled:
    - tags
  layouts:
    tag: tag
  permalinks:
    tag: '/tags/:name/'